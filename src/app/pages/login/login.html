<div class="auth">
  <form class="auth-card" (submit)="$event.preventDefault()">
    <p class="brand">Savemark</p>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue saving your Bookmarks.</p>

    <label>
      Username
      <input type="text" name="username" autocomplete="username" placeholder="Enter username" />
    </label>

    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" placeholder="Enter password" />
    </label>

    <button type="submit">Login</button>

    <p class="switch">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </form>
</div>
